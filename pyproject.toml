[project]
name = "maxop-mcp-harness"
version = "0.3.4"
description = "Gated MCP-shaped agentic code harness with plain-English easy mode"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
maxop = "maxop_harness.__main__:_entry"
maxop-harness = "maxop_harness.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maxop_harness = ["pin.json"]
