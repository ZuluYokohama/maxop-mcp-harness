name: selftest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run planted-fixture selftest G1–G11
        run: python -m maxop_harness.cli selftest
      - name: Run adversarial transaction and path tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src tests
